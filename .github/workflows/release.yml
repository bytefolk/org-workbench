name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the release as a draft"
        required: false
        default: true
        type: boolean

# Read by default. Only the publish job is granted write, and only to contents.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - name: Check out org-workbench
        uses: actions/checkout@v6
        with:
          # The tag-object and reachability checks below read history and the
          # annotated tag itself; the default shallow single-ref fetch has
          # neither.
          fetch-depth: 0

      - name: Read packaged version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with the packaged version produces artifacts whose
      # filenames contradict the release they are attached to, and an updater
      # that compares the wrong things. Fail before anything is built.
      - name: Refuse a tag that disagrees with the packaged version
        if: github.event_name == 'push'
        shell: bash
        run: |
          expected="v${{ steps.version.outputs.value }}"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the packaged version ${expected}"
            exit 1
          fi

      # #187 / RELEASING.md Phase 4: resolve the full tag ref and refuse a
      # lightweight tag. A lightweight tag is a bare pointer with no tagger,
      # message or object to peel, so there is nothing immutable to record as
      # "the release tag" and nothing to prove the tag was made deliberately.
      - name: Refuse a lightweight tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          object_type="$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")"
          if [ "$object_type" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} is a ${object_type}, not an annotated tag; a release tag must be annotated"
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is an annotated tag object $(git rev-parse "refs/tags/${GITHUB_REF_NAME}")"

      # #187 / Phase 4: refuse a non-main tag. A tag can point at any commit,
      # including one that never reached the protected branch, and building from
      # it would publish code that passed no review on main.
      - name: Refuse a tag that is not reachable from main
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin refs/heads/main:refs/remotes/origin/main
          release_commit="$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor "${release_commit}" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} peels to ${release_commit}, which is not reachable from origin/main"
            exit 1
          fi
          echo "${GITHUB_REF_NAME} peels to ${release_commit}, reachable from origin/main"

      # A published release is a thing people may already have downloaded and a
      # thing clients may already be updating from. Replacing its assets is not
      # a release, it is a substitution.
      - name: Refuse to overwrite a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.value }}"
          state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo absent)"
          case "$state" in
            absent) echo "no existing release for $tag" ;;
            true)   echo "::warning::draft release $tag exists and will be replaced" ;;
            false)  echo "::error::release $tag is already published; bump the version instead"; exit 1 ;;
          esac

      # Signed status is derived from the secrets #135 and #136 will introduce, not
      # from a constant. The gate below then opens on its own when they land,
      # instead of depending on someone remembering to flip a flag.
      - name: Determine signing status
        id: signing
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          WINDOWS_SIGNING_TOKEN: ${{ secrets.WINDOWS_SIGNING_TOKEN }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$WINDOWS_SIGNING_TOKEN" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing credentials configured. This release stays a draft: macOS artifacts are install-only (Gatekeeper blocks first launch, #135) and the Windows installer draws a SmartScreen prompt (#136). An unsigned build must not reach a published release, because a client updating from one gets no publisher verification -- electron-updater skips signature checks entirely when the installed app carries no publisherName."
          fi

      # The reference project refuses to publish a non-draft release without
      # signing, and that is the boundary adopted here. It is also what keeps an
      # unsigned build from ever discovering an update: GitHub's /releases/latest,
      # which electron-updater reads, excludes drafts.
      - name: Refuse a published release while unsigned
        if: steps.signing.outputs.signed != 'true'
        shell: bash
        run: |
          requested_draft="${{ github.event_name == 'workflow_dispatch' && inputs.draft || 'true' }}"
          if [ "$requested_draft" != "true" ]; then
            echo "::error::Refusing to publish a non-draft release without signing credentials. Re-run with draft enabled, or land #135 and #136 first."
            exit 1
          fi

  build:
    name: Build (${{ matrix.label }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS-arm64
            runs-on: macos-15
            package: package:dist:macos
            verify: verify:dist:macos
          - label: Windows-x64
            runs-on: windows-latest
            package: package:dist:windows
            verify: verify:dist:windows
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    steps:
      - name: Check out org-workbench
        uses: actions/checkout@v6
        with:
          path: org-workbench

      - name: Check out pinned design system
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/design-system
          ref: 9d048faaabe0429a6a8720bfbb31418544237b6b
          path: design-system

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            design-system/package-lock.json
            org-workbench/package-lock.json

      - name: Build pinned design system
        working-directory: design-system
        run: |
          npm ci
          npm run build:package

      - name: Install workbench
        working-directory: org-workbench
        run: npm ci

      - name: Build unsigned installers
        working-directory: org-workbench
        run: npm run ${{ matrix.package }}

      - name: Verify installer asset set
        working-directory: org-workbench
        run: npm run ${{ matrix.verify }}

      # Every leg writes latest*.yml. Uploaded under one name they would
      # overwrite each other and the surviving file would describe one platform
      # while claiming to describe the release.
      - name: Namespace update metadata
        working-directory: org-workbench/release/dist
        shell: bash
        run: |
          shopt -s nullglob
          for file in latest*.yml; do
            mv "$file" "${file%.yml}--${{ matrix.label }}.yml"
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          if-no-files-found: error
          path: |
            org-workbench/release/dist/*.dmg
            org-workbench/release/dist/*.zip
            org-workbench/release/dist/*.exe
            org-workbench/release/dist/*.blockmap
            org-workbench/release/dist/latest*.yml

  publish:
    name: Publish release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only elevated grant in this workflow, and the narrowest one that can
    # create a release.
    permissions:
      contents: write
    steps:
      - name: Download every leg's artifacts
        uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: release-*
          merge-multiple: true

      # Restore the per-platform names electron-updater expects. The namespacing
      # existed to survive the upload, not to reach the release.
      - name: Restore update metadata names
        shell: bash
        working-directory: incoming
        run: |
          shopt -s nullglob
          for file in latest*--*.yml; do
            mv "$file" "$(printf '%s' "$file" | sed -E 's/--[^.]+\.yml$/.yml/')"
          done
          ls -la

      # #187 / RELEASING.md Phase 4: upload to a draft first. Publication is a
      # separate, final step so nothing is reachable at /releases/latest before
      # its assets have been read back.
      - name: Create the release as a draft
        id: create
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ needs.preflight.outputs.version }}"
          # Whether this release may leave draft at all. Unsigned never does: an
          # unsigned build behind /releases/latest would be offered to every
          # client as an update electron-updater cannot verify.
          publish=false
          if [ "${{ needs.preflight.outputs.signed }}" = "true" ]; then
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.draft }}" != "true" ]; then
              publish=true
            fi
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes "Unsigned build, install-only on both platforms. In-app update is refused while a build carries no publisher identity: electron-updater skips signature verification entirely without one, so an update could not be checked before it replaced the app. macOS also needs a Developer ID build for Gatekeeper and Squirrel.Mac (#135); the Windows installer draws a SmartScreen prompt until Authenticode signing lands (#136). Install by downloading from this page." \
            --draft \
            incoming/*

      # #187 / Phase 4: read back the exact non-empty asset inventory and the
      # checksums, from the API rather than from what this job believes it
      # uploaded. A draft has no tag-named endpoint, so it is found by tag in the
      # release list.
      - name: Read back the asset inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.create.outputs.tag }}"
          expected="$(cd incoming && ls -1 | sort)"
          release_id="$(gh api "repos/${{ github.repository }}/releases" \
            --jq "[.[] | select(.tag_name == \"${tag}\")][0].id")"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "::error::no release found for ${tag} after creating it"
            exit 1
          fi

          # GitHub computes an asset digest shortly after upload, so the readback
          # is retried rather than asserted on the first response.
          for attempt in $(seq 1 12); do
            # per_page rather than --paginate: with more than one page gh emits
            # several concatenated JSON arrays, which jq cannot read as one.
            assets="$(gh api "repos/${{ github.repository }}/releases/${release_id}/assets?per_page=100")"
            pending="$(jq -r '[.[] | select(.state != "uploaded" or .digest == null)] | length' <<< "$assets")"
            [ "$pending" = "0" ] && break
            echo "waiting for ${pending} asset(s) to finish uploading (attempt ${attempt})"
            sleep 5
          done

          actual="$(jq -r '[.[].name] | sort | .[]' <<< "$assets")"
          if [ -z "$actual" ]; then
            echo "::error::release ${tag} reports no assets"
            exit 1
          fi
          if ! diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual"); then
            echo "::error::the release inventory does not match what was uploaded"
            exit 1
          fi

          bad="$(jq -r '[.[] | select(.size == 0 or .state != "uploaded" or .digest == null) | .name] | join(" ")' <<< "$assets")"
          if [ -n "$bad" ]; then
            echo "::error::asset(s) empty, unfinished, or without a digest: ${bad}"
            exit 1
          fi
          jq -r '.[] | "\(.name)  \(.size) bytes  \(.digest)"' <<< "$assets"

      # The final step, and only for a signed release. Until #135 and #136 this
      # is always skipped and the release stays a verified draft.
      - name: Publish the release
        if: steps.create.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "${{ steps.create.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false
          gh release view "${{ steps.create.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --json isDraft,url \
            --jq '"published: isDraft=\(.isDraft) \(.url)"'
