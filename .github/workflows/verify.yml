name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Node 24 / ${{ matrix.os }}
    # This matrix is deliberately POSIX-only. Running the whole suite on
    # windows-latest was tried and reverted: the suite is written against POSIX
    # process and filesystem semantics, and the leg hung on `npm run check` for
    # over an hour with no bounded failure to point at. Windows is covered by a
    # purpose-built leg instead -- staging package, verify and smoke -- which is
    # green. Re-adding this platform means porting the suite first, not just
    # adding the runner.
    #
    # The bound below stays regardless: the staging jobs were always bounded and
    # this one was not. Per-test bounds live in the node --test invocations.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out org-workbench
        uses: actions/checkout@v6
        with:
          path: org-workbench

      - name: Check out pinned design system
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/design-system
          ref: 9d048faaabe0429a6a8720bfbb31418544237b6b
          path: design-system

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            design-system/package-lock.json
            org-workbench/package-lock.json

      - name: Build pinned design system
        working-directory: design-system
        run: |
          npm ci
          npm run build:package

      - name: Install workbench
        working-directory: org-workbench
        run: npm ci

      - name: Verify workbench
        working-directory: org-workbench
        run: npm run check

  staging-macos-arm64:
    name: Unpacked staging smoke / macOS arm64
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out org-workbench
        uses: actions/checkout@v6
        with:
          path: org-workbench

      - name: Check out pinned design system
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/design-system
          ref: 9d048faaabe0429a6a8720bfbb31418544237b6b
          path: design-system

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            design-system/package-lock.json
            org-workbench/package-lock.json

      - name: Build pinned design system
        working-directory: design-system
        run: |
          npm ci
          npm run build:package

      - name: Install workbench
        working-directory: org-workbench
        run: npm ci

      - name: Stage unsigned macOS app
        working-directory: org-workbench
        run: npm run package:staging:macos

      - name: Verify macOS staging manifest
        working-directory: org-workbench
        run: npm run verify:package:macos

      - name: Smoke macOS clean staging copy
        working-directory: org-workbench
        run: npm run smoke:package:macos

      - name: Qualify packaged PATH and Qoder behavior
        working-directory: org-workbench
        run: npm run smoke:package:macos:behavior

  staging-windows-x64:
    name: Unpacked staging smoke / Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out org-workbench
        uses: actions/checkout@v6
        with:
          path: org-workbench

      - name: Check out pinned design system
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/design-system
          ref: 9d048faaabe0429a6a8720bfbb31418544237b6b
          path: design-system

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            design-system/package-lock.json
            org-workbench/package-lock.json

      - name: Build pinned design system
        working-directory: design-system
        run: |
          npm ci
          npm run build:package

      - name: Install workbench
        working-directory: org-workbench
        run: npm ci

      - name: Stage unsigned Windows app
        working-directory: org-workbench
        run: npm run package:staging:windows

      - name: Verify Windows staging manifest
        working-directory: org-workbench
        run: npm run verify:package:windows

      - name: Smoke Windows clean staging copy
        working-directory: org-workbench
        run: npm run smoke:package:windows
