name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Node 24 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out org-workbench
        uses: actions/checkout@v6
        with:
          path: org-workbench

      - name: Check out pinned design system
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/design-system
          ref: 9d048faaabe0429a6a8720bfbb31418544237b6b
          path: design-system

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            design-system/package-lock.json
            org-workbench/package-lock.json

      - name: Build pinned design system
        working-directory: design-system
        run: |
          npm ci
          npm run build:package

      - name: Install workbench
        working-directory: org-workbench
        run: npm ci

      - name: Verify workbench
        working-directory: org-workbench
        run: npm run check
