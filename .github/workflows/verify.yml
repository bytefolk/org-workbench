name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Node 24 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out org-workbench
        uses: actions/checkout@v6
        with:
          path: org-workbench

      - name: Check out pinned design system
        uses: actions/checkout@v6
        with:
          repository: fullstack-ai-infra/design-system
          ref: 9d048faaabe0429a6a8720bfbb31418544237b6b
          path: design-system

      - name: Check out pinned Context provider
        uses: actions/checkout@v6
        with:
          repository: fullstack-ai-infra/context
          ref: f63f57f7b4cb7071309561f0383683017ae79eb2
          persist-credentials: false
          path: context

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            design-system/package-lock.json
            org-workbench/package-lock.json

      - name: Build pinned design system
        working-directory: design-system
        run: |
          npm ci
          npm run build:package

      - name: Build pinned Context provider
        working-directory: context
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install workbench
        working-directory: org-workbench
        run: npm ci

      - name: Verify workbench
        working-directory: org-workbench
        run: npm run check

      - name: Verify Context occurrence export E3
        working-directory: org-workbench
        env:
          ORG_WORKBENCH_REQUIRE_CONTEXT_E3: "1"
          ORG_WORKBENCH_CONTEXT_E3_CLI: node ${{ github.workspace }}/context/packages/cli/dist/index.js
        run: npm run test:context-e3
